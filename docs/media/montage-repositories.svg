<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Montage repository and CLI boundaries</title>
  <desc id="desc">The mntg CLI validates private vault history, loadout libraries, panel JSON, optional GitHub synchronization, and explicit Ress v1 ports between separate paths.</desc>
  <rect width="1200" height="520" fill="#0d1117"/>
  <g font-family="ui-monospace, monospace" fill="#c9d1d9">
    <text x="60" y="62" font-size="30" font-weight="700">Montage keeps identity and decisions explicit</text>
    <text x="60" y="94" font-size="17" fill="#84909c">One authoritative CLI · two native repository kinds · one bounded legacy port</text>
    <g stroke="#26313d" stroke-width="2" fill="#11161d">
      <rect x="60" y="155" width="245" height="205" rx="12"/>
      <rect x="365" y="155" width="245" height="205" rx="12"/>
      <rect x="670" y="155" width="245" height="205" rx="12"/>
      <rect x="975" y="155" width="165" height="205" rx="12"/>
    </g>
    <text x="88" y="198" font-size="22" fill="#7fd1c1">Panel</text>
    <text x="88" y="235" font-size="16">versioned JSON</text>
    <text x="88" y="263" font-size="16">porcelain progress</text>
    <text x="88" y="291" font-size="16">terminal handoff</text>
    <text x="88" y="330" font-size="15" fill="#84909c">never parses Git</text>

    <text x="393" y="198" font-size="22" fill="#7fd1c1">mntg</text>
    <text x="393" y="235" font-size="16">validate · preview</text>
    <text x="393" y="263" font-size="16">lock · stage · commit</text>
    <text x="393" y="291" font-size="16">restore · verify</text>
    <text x="393" y="330" font-size="15" fill="#84909c">only public CLI</text>

    <text x="698" y="198" font-size="22" fill="#7fd1c1">Native repositories</text>
    <text x="698" y="235" font-size="16">private vault history</text>
    <text x="698" y="263" font-size="16">multi-loadout library</text>
    <text x="698" y="291" font-size="16">stable ids + commits</text>
    <text x="698" y="330" font-size="15" fill="#84909c">montage.json</text>

    <text x="1003" y="198" font-size="22" fill="#7fd1c1">GitHub</text>
    <text x="1003" y="235" font-size="16">optional</text>
    <text x="1003" y="263" font-size="16">credential helper</text>
    <text x="1003" y="291" font-size="16">no force push</text>
    <text x="1003" y="330" font-size="15" fill="#84909c">vaults private</text>

    <g stroke="#7fd1c1" stroke-width="3" fill="none">
      <path d="M305 258 H365"/><path d="M610 258 H670"/><path d="M915 258 H975"/>
    </g>
    <g fill="#7fd1c1">
      <path d="M357 251 l12 7 -12 7z"/><path d="M662 251 l12 7 -12 7z"/><path d="M967 251 l12 7 -12 7z"/>
    </g>
    <rect x="365" y="405" width="550" height="66" rx="10" fill="#11161d" stroke="#e3b341" stroke-width="2"/>
    <text x="393" y="434" font-size="17" fill="#e3b341">Ress v1 source → inspect/plan → separate Montage destination</text>
    <text x="393" y="458" font-size="15" fill="#84909c">No shared live directory · source unchanged · explicit losses</text>
  </g>
</svg>
